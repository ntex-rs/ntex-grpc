[workspace]
members = [
  "ntex-grpc",
  "ntex-grpc-codegen",
  "ntex-grpc-derive",
  "examples/custom",
  "examples/helloworld",
  "examples/routeguide"
]
resolver = "3"

[patch.crates-io]
ntex-grpc = { path = "./ntex-grpc" }
ntex-grpc-derive = { path = "./ntex-grpc-derive" }
ntex-grpc-codegen = { path = "./ntex-grpc-codegen" }

[workspace.dependencies]
ntex-grpc = "4.0.0"
ntex-grpc-derive = "4.0.0"
ntex-grpc-codegen = "1.0.0"

ntex = "4.4.0"
ntex-bytes = "1.14"
ntex-error = "3.1"
ntex-http = "2.1"
ntex-h2 = "4.4.0"
ntex-io = "4.6.0"
ntex-net = "4.7.0"
ntex-rt = "4.4.0"
ntex-util = "4.5.0"
ntex-service = "5.3.0"

base64 = "0.22"
flate2 = "1.1.3"
bitflags = "2"
cmake = "0.1"
cfg-if = "1"
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11"
heck = "0.5"
itertools = "0.15"
log = "0.4"
multimap = "0.10"
num_cpus = "1"
openssl = "0.10"
regex = "1.13"
pin-project-lite = "0.2"
proc-macro2 = "1"
quote = "1"
syn = "3"
tempfile = "3"
thiserror = "2"
urly = "1.1"
uuid = "1"
zstd = "0.13"
which = "8"
