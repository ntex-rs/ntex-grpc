[package]
name = "ntex-grpc-codegen"
version = "1.0.0"
license = "MIT OR Apache-2.0"
authors = ["Nikolay Kim <fafhrd91@gmail.com>"]
description = "GRPC Client/Server framework (codegen)"
documentation = "https://docs.rs/ntex-grpc-codegen"
repository = "https://github.com/ntex-rs/ntex-grpc"
readme = "README.md"
keywords = ["grpc"]
categories = ["asynchronous", "network-programming"]
edition = "2024"
rust-version = "1.97"

[[bin]]
name = "ntex-grpc"
path = "src/main.rs"

[features]
default = []
vendored = []

[dependencies]
clap = { workspace = true, features = ["derive"] }
heck = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
multimap = { workspace = true }
env_logger = { workspace = true }
tempfile = { workspace = true }
regex = { workspace = true, default-features = false, features = ["std", "unicode-bool"] }

prost = { version = "0.14", default-features = false }
prost-types = { version = "0.14", default-features = false }

[build-dependencies]
which = { workspace = true }
cfg-if = { workspace = true }
cmake = { workspace = true }
