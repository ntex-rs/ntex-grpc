[package]
name = "ntex-grpc-codegen"
version = "0.3.0"
license = "MIT OR Apache-2.0"
authors = ["Nikolay Kim <fafhrd91@gmail.com>"]
description = "GRPC Client/Server framework (codegen)"
documentation = "https://docs.rs/ntex-grpc-codegen"
repository = "https://github.com/ntex-rs/ntex-grpc"
readme = "README.md"
keywords = ["grpc"]
categories = ["asynchronous", "network-programming"]
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "ntex-grpc"
path = "src/main.rs"

[dependencies]
ntex-prost-build = { workspace = true }

clap = { workspace = true, features = ["derive"] }
log = { workspace = true }
env_logger = { workspace = true }
