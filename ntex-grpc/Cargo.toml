[package]
name = "ntex-grpc"
version = "2.2.0"
license = "MIT OR Apache-2.0"
authors = ["Nikolay Kim <fafhrd91@gmail.com>"]
description = "GRPC Client/Server framework"
documentation = "https://docs.rs/ntex-grpc"
repository = "https://github.com/ntex-rs/ntex-grpc"
readme = "README.md"
keywords = ["grpc"]
categories = ["asynchronous", "network-programming"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "ntex_grpc"
path = "src/lib.rs"

[dependencies]
ntex-grpc-derive = "2.0"

ntex-error = "2.2"
ntex-h2 = "3.11.1"
ntex-http = "1.2"
ntex-io = "3.12"
ntex-net = "3.12"
ntex-util = "3.5"
ntex-bytes = "1.6"
ntex-service = "4.6"

bitflags = "2"
log = "0.4"
thiserror = "2"
pin-project-lite = "0.2"

[dev-dependencies]
openssl = "0.10"
env_logger = "0.11"
ntex = { version = "3.9.0", features = ["openssl", "neon"] }
